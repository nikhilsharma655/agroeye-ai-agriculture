version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agroeye_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agroeye
      POSTGRES_PASSWORD: agroeye_password
      POSTGRES_DB: agroeye_db
    ports:
      - "5432:5432"
    volumes:
      - agroeye_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroeye -d agroeye_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agroeye_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agroeye:agroeye_password@postgres:5432/agroeye_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_to_a_long_random_secret_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend
      N8N_BASE_URL: http://n8n:5678
      N8N_FARM_ALERT_WEBHOOK_URL: http://n8n:5678/webhook/agroeye/farm-alert
      N8N_IRRIGATION_ALERT_WEBHOOK_URL: http://n8n:5678/webhook/agroeye/irrigation-alert
      N8N_RECOMMENDATION_WEBHOOK_URL: http://n8n:5678/webhook/agroeye/recommendation
      N8N_WEBHOOK_SHARED_SECRET: ${N8N_WEBHOOK_SHARED_SECRET:-change_this_shared_secret}
      APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./ml/saved_models:/ml/saved_models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: agroeye_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  n8n:
    image: n8nio/n8n:latest
    container_name: agroeye_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      AGROEYE_API_BASE_URL: http://backend:8000
      AGROEYE_WEBHOOK_SECRET: ${N8N_WEBHOOK_SHARED_SECRET:-change_this_shared_secret}
    ports:
      - "5678:5678"
    volumes:
      - agroeye_n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - backend

volumes:
  agroeye_pg_data:
  agroeye_n8n_data:
